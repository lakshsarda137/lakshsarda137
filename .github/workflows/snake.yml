name: Contribution snake

on:
  schedule:
    - cron: "17 6 * * *"   # daily
  workflow_dispatch:

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Check out profile repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Generate light and dark snake
        uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=%231f6feb
            dist/snake-dark.svg?palette=github-dark&color_snake=%2358a6ff&color_dots=%232d333b,%230e5a2a,%231f883d,%233fb950,%237ee787

      # Keep the snake on the grid, trim the empty margin, respect reduced motion.
      - name: Post-process SVGs
        shell: bash
        run: |
          sudo chown -R "$(id -u):$(id -g)" dist
          python3 .github/scripts/snake_postprocess.py dist/*.svg

      # Publish to a separate "output" branch as a single commit, so main stays free of bot commits.
      - name: Publish to the output branch
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git -C dist init -q -b output
          git -C dist config user.name "github-actions[bot]"
          git -C dist config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C dist add .
          git -C dist commit -q -m "Update contribution snake"
          git -C dist push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
