name: Contribution snake

on:
  schedule:
    - cron: "17 6 * * *"   # daily
  workflow_dispatch:

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Check out profile repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # Custom generator: the snake sweeps the graph column by column and never leaves it.
      - name: Generate light and dark snake
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/snake.py --user "${{ github.repository_owner }}" --out dist

      # Publish to a separate "output" branch as a single commit, so main stays free of bot commits.
      - name: Publish to the output branch
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git -C dist init -q -b output
          git -C dist config user.name "github-actions[bot]"
          git -C dist config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C dist add .
          git -C dist commit -q -m "Update contribution snake"
          git -C dist push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
